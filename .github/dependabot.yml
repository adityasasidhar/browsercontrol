version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    ignore:
      # fastmcp 4 negotiates a session-less MCP protocol, so ctx.session_id changes on
      # every request and isolate_clients breaks. Remove once client identity is redesigned.
      - dependency-name: fastmcp
        versions: [">=4"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
