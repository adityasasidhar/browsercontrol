name: Release

on:
  push:
    tags: ["v*"]

# Least privilege by default; individual jobs widen this where needed.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify tag and gate on tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Check tag matches the version in pyproject.toml
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          project=$(python3 -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "tag version:     ${tag}"
          echo "project version: ${project}"
          if [ "${tag}" != "${project}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${project}. Bump the version and re-tag."
            exit 1
          fi
          echo "version=${project}" >> "${GITHUB_OUTPUT}"

      - name: Refuse to re-release an existing PyPI version
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          status=$(curl -sS -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/browsercontrol/${version}/json")
          if [ "${status}" = "200" ]; then
            echo "::error::browsercontrol ${version} is already on PyPI. PyPI does not allow overwriting a release; bump the version."
            exit 1
          fi
          echo "Version ${version} is not yet on PyPI; continuing."

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        run: uv run mypy browsercontrol/

      - name: Security scan
        run: uv run bandit -c pyproject.toml -r . --exclude ./tests,./.venv

      - name: Run tests
        run: uv run pytest -v

  build:
    name: Build distributions
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/browsercontrol
    permissions:
      # Required for PyPI Trusted Publishing (OIDC). No API token is stored.
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

  mcp-registry:
    name: Publish to the MCP Registry
    # Runs after PyPI: the registry verifies ownership by reading the
    # mcp-name marker from the README of the version just published.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write # GitHub OIDC login to the registry; no token is stored.
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Wait for the release to appear on PyPI
        run: |
          set -euo pipefail
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null "https://pypi.org/pypi/browsercontrol/${GITHUB_REF_NAME#v}/json"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::browsercontrol ${GITHUB_REF_NAME#v} did not appear on PyPI in time"
          exit 1

      - name: Authenticate to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish

  github-release:
    name: Create GitHub Release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/*
