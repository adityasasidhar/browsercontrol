[project]
name = "browsercontrol"
version = "0.4.0"
description = "MCP server that gives AI agents a real browser: screenshots with numbered elements, so the agent clicks by number"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "Aditya Sasidhar" }
]
keywords = [
    "mcp", "mcp-server", "model-context-protocol", "browser", "browser-automation",
    "playwright", "set-of-marks", "computer-use", "web-agent", "ai", "agent", "llm",
    "claude", "codex",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
    "fastmcp>=3.4.10",
    "playwright>=1.49.0",
    "markdownify>=0.14.1",
    "pillow>=13.0.0",
]

[project.urls]
Homepage = "https://github.com/adityasasidhar/browsercontrol"
Repository = "https://github.com/adityasasidhar/browsercontrol"
Documentation = "https://adityasasidhar.github.io/browsercontrol/"
Changelog = "https://github.com/adityasasidhar/browsercontrol/blob/main/CHANGELOG.md"

[project.scripts]
browsercontrol = "browsercontrol.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["browsercontrol"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "mypy>=1.0.0",
    "bandit>=1.7.0",
    "pytest-cov>=5.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".git", ".venv", "__pycache__", "build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "TCH", "RUF"]
ignore = ["E501", "B008", "N805", "SIM117", "B904"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**/*.py" = ["F401", "F811"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["-v", "--strict-markers", "--tb=short"]
filterwarnings = [
    "error::RuntimeWarning",
    # "coroutine was never awaited" fires from garbage collection, which pytest reports as this.
    "error::pytest.PytestUnraisableExceptionWarning",
]
markers = ["browser: drives a real headless Chromium (skipped when it is not installed)"]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "docs/node_modules"]
skips = ["B404", "B603"]  # Allow subprocess usage for Playwright installation

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
